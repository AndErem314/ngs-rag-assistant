name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start services with docker-compose
        run: |
          docker-compose up -d
          echo "Waiting for pgvector..."
          timeout 30 bash -c 'until docker exec ngs-rag-pgvector pg_isready -U ngs_user -d ngs_rag; do sleep 1; done'
          echo "Waiting for Ollama..."
          timeout 30 bash -c 'until curl -f http://localhost:11434; do sleep 1; done'

      - name: Pull Ollama embedding model
        run: |
          docker exec ngs-rag-ollama ollama pull haybu/mxbai-embed-large:latest

      - name: Run tests
        run: |
          python -m pytest tests/ -v
        env:
          OLLAMA_HOST: http://localhost:11434
          PGVECTOR_HOST: localhost
          PGVECTOR_PORT: 5432
          PGVECTOR_USER: ngs_user
          PGVECTOR_PASSWORD: ngs_secure_password
          PGVECTOR_DB: ngs_rag
