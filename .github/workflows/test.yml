name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v

  integration-tests:
    name: Integration Tests (pgvector)
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:latest
        env:
          POSTGRES_USER: ngs_user
          POSTGRES_PASSWORD: ngs_secure_password
          POSTGRES_DB: ngs_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ngs_user -d ngs_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create pgvector extension
        run: |
          PGPASSWORD=ngs_secure_password psql -h localhost -U ngs_user -d ngs_rag -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run pgvector integration tests
        run: |
          python -m pytest tests/test_pgvector_store.py -v
        env:
          NGS_PGVECTOR_URL: postgresql://ngs_user:ngs_secure_password@localhost:5432/ngs_rag
