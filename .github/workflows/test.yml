name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "curl -f http://localhost:11434 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start pgvector via docker-compose
        run: |
          docker-compose up -d
          # Wait for pgvector to be ready (install netcat then check port)
          sudo apt-get update && sudo apt-get install -y netcat
          timeout 30 bash -c 'until nc -z localhost 5432; do sleep 1; done'

      - name: Wait for Ollama to be ready
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:11434; do sleep 1; done'

      - name: Pull Ollama embedding model
        run: |
          # Pull model into the Ollama service container
          docker exec $(docker ps -q --filter "name=ollama") ollama pull haybu/mxbai-embed-large:latest

      - name: Run tests
        run: |
          python -m pytest tests/ -v
        env:
          OLLAMA_HOST: http://localhost:11434
