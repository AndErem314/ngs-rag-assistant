version: '3.8'

services:
  pgvector:
    image: pgvector/pgvector:latest
    container_name: ngs-rag-pgvector
    environment:
      POSTGRES_USER: ngs_user
      POSTGRES_PASSWORD: ngs_secure_password
      POSTGRES_DB: ngs_rag
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngs_user -d ngs_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
