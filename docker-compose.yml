version: '3.8'

services:
  pgvector:
    image: pgvector/pgvector:latest
    container_name: ngs-rag-pgvector
    environment:
      POSTGRES_USER: ngs_user
      POSTGRES_PASSWORD: ngs_secure_password
      POSTGRES_DB: ngs_rag
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngs_user -d ngs_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ngs-rag-ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgvector_data:
  ollama_data:
